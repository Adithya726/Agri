

spring.application.name=agrisense-backend

spring.datasource.url=jdbc:mysql://localhost:3306/capstone_project
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

agrisense.ml.disease-url=${DISEASE_SERVICE_URL:http://localhost:5001/predict}
agrisense.ml.yield-url=${YIELD_SERVICE_URL:http://localhost:5002/predict}

# JWT auth: override the secret with AGRISENSE_JWT_SECRET (at least 32 bytes) outside local dev
agrisense.jwt.secret=${AGRISENSE_JWT_SECRET:agrisense-local-dev-secret-change-me-0123456789}
agrisense.jwt.expiration-minutes=${AGRISENSE_JWT_EXPIRATION_MINUTES:480}
agrisense.cors.allowed-origins=${AGRISENSE_CORS_ORIGINS:http://localhost:5173}

server.port=8081